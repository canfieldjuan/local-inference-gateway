[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-inference-gateway"
version = "0.1.0"
description = "Private on-prem inference gateway for Local Connect applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<50",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.12,<3",
  "uvicorn>=0.41,<1",
]

[project.scripts]
local-inference-gateway = "local_inference_gateway.__main__:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_inference_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in checks against a real local inference worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local_inference_gateway"]
